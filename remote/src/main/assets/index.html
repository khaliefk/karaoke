<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Karaoke</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ MODE TV ============ -->
<div id="tvView" class="hidden">
  <!-- Layar tunggu -->
  <div id="waitScreen" class="wait-screen">
    <div class="wait-title">🎤 KARAOKE FOR TV</div>
    <div class="wait-sub">Scan QR dari HP untuk mulai karaoke</div>
    <img id="qrImg" class="qr-img" src="/qr.png" alt="QR pairing">
    <div class="wait-code-label">atau masukkan kode di HP:</div>
    <div id="pairCode" class="wait-code">------</div>
    <div id="waitIp" class="wait-ip"></div>
  </div>
  <!-- Layar player -->
  <div id="playerScreen" class="player-screen hidden">
    <div id="playerWrap"><div id="player"></div></div>
    <div id="nowBar" class="now-bar">
      <div id="nowTitle" class="now-title"></div>
      <div id="nextTitle" class="now-next"></div>
    </div>
  </div>
</div>

<!-- ============ MODE PHONE ============ -->
<div id="phoneView" class="hidden">
  <header class="phone-header">
    <div class="phone-title">🎤 Karaoke Remote</div>
    <div id="connDot" class="conn-dot off" title="status koneksi"></div>
  </header>
  <div id="connMsg" class="conn-msg">Menghubungkan ke TV…</div>

  <section class="search-box">
    <input id="searchInput" type="search" placeholder="Cari lagu karaoke…" enterkeyhint="search">
    <button id="searchBtn" class="btn primary">Cari</button>
  </section>
  <div id="searchStatus" class="search-status"></div>
  <div id="results" class="results"></div>

  <section id="npCard" class="np-card hidden">
    <div class="np-label">SEDANG DIPUTAR</div>
    <div id="npTitle" class="np-title">—</div>
    <div class="np-progress"><div id="npBar" class="np-bar"></div></div>
    <div id="npTime" class="np-time">0:00 / 0:00</div>
    <div class="np-controls">
      <button id="btnPrev" class="btn ctrl" title="Sebelumnya">⏮</button>
      <button id="btnPlayPause" class="btn ctrl big" title="Putar/Jeda">⏸</button>
      <button id="btnNext" class="btn ctrl" title="Berikutnya">⏭</button>
      <button id="btnReplay" class="btn ctrl" title="Putar ulang">↺</button>
    </div>
    <div class="vol-row">
      <span>🔈</span>
      <input id="volSlider" type="range" min="0" max="100" value="80">
      <span>🔊</span>
      <span id="volVal">80</span>
    </div>
  </section>

  <section class="queue-sec">
    <div class="queue-head">
      <span>Antrean (<span id="queueCount">0</span>)</span>
      <button id="btnClearQueue" class="btn small danger">Bersihkan</button>
    </div>
    <div id="queueList" class="queue-list"></div>
  </section>

  <button id="btnRescan" class="btn ghost hidden" onclick="rescanQr()">Scan Ulang QR TV</button>
</div>

<script src="app.js"></script>
</body>
</html>
